name: dsclinux

on:
  pull_request:
    paths:
      - ".github/workflows/dsclinux.yml"
      - "resources/linux/**"
  push:
    branches:
      - "**"
    tags:
      - "dsclinux-v*"
    paths:
      - ".github/workflows/dsclinux.yml"
      - "resources/linux/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DSCLINUX_REQUIRE_DSC: "1"
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: resources/linux
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          version=$(jq -er '.version | select(type == "string")' manifests/services.dsc.resource.json)
          if [[ "$(jq -er '.version' manifests/groups.dsc.resource.json)" != "$version" ]]; then
            echo "::error::Linux resource manifest versions must agree."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/dsclinux-v* ]]; then
            version="${GITHUB_REF#refs/tags/dsclinux-v}"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable X.Y.Z version; release tags must use dsclinux-vX.Y.Z."
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Verify release commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dsclinux-v')
        run: |
          fetch_args=(--no-tags)
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            fetch_args+=(--unshallow)
          fi
          git fetch "${fetch_args[@]}" origin '+refs/heads/main:refs/remotes/origin/main'
          if ! tag_commit=$(git rev-parse --verify "${GITHUB_REF}^{commit}"); then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not resolve to a commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Release commit must be merged into main before tagging."
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: resources/linux/go.mod
          cache-dependency-path: resources/linux/go.mod
      - name: Install DSC
        run: |
          dsc_dir="$RUNNER_TEMP/dsc-3.3.0"
          mkdir -p "$dsc_dir"
          curl --fail --silent --show-error --location \
            https://github.com/PowerShell/DSC/releases/download/v3.3.0/DSC-3.3.0-x86_64-linux.tar.gz \
            --output "$dsc_dir/dsc.tar.gz"
          echo "cf17d1a130b65332ec65380ee9368133101d13d8f40c1a501038920b1e9cd748  $dsc_dir/dsc.tar.gz" | sha256sum --check
          tar -xzf "$dsc_dir/dsc.tar.gz" -C "$dsc_dir"
          test "$("$dsc_dir/dsc" --version)" = "dsc 3.3.0"
          echo "$dsc_dir" >> "$GITHUB_PATH"
      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Test including DSC integration
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  systemd-container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: resources/linux/go.mod
          cache-dependency-path: resources/linux/go.mod
      - name: Test real systemd in a disposable container
        env:
          DSCLINUX_SYSTEMD_CONTAINER: "1"
        run: go test -v -count=1 -timeout=6m ./internal/services -run '^TestSystemdContainer$'

  groups-container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: resources/linux/go.mod
          cache-dependency-path: resources/linux/go.mod
      - name: Test real account management in a disposable container
        env:
          DSCLINUX_GROUPS_CONTAINER: "1"
        run: go test -v -count=1 -timeout=6m ./internal/groups -run '^TestGroupsContainer$'

  build:
    needs: [test, systemd-container, groups-container]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: resources/linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: resources/linux/go.mod
          cache-dependency-path: resources/linux/go.mod
      - name: Build and package
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          package_dir="dist/linux-${GOARCH}"
          mkdir -p "$package_dir"
          go build -trimpath -ldflags "-X main.version=${VERSION}" -o "$package_dir/dsclinux" ./cmd/dsclinux
          for resource in services groups; do
            jq --arg version "$VERSION" '.version = $version' "manifests/${resource}.dsc.resource.json" > "$package_dir/${resource}.dsc.resource.json"
          done
          cp ../../LICENSE "$package_dir/"
          chmod 755 "$package_dir/dsclinux"
          (
            cd "$package_dir"
            zip -X "../dsclinux-${VERSION}-linux-${GOARCH}.zip" dsclinux services.dsc.resource.json groups.dsc.resource.json LICENSE
          )
      - name: Verify package
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          archive="dist/dsclinux-${VERSION}-linux-${GOARCH}.zip"
          check_dir="dist/check-${GOARCH}"
          unzip -t "$archive"
          test "$(unzip -Z1 "$archive" | LC_ALL=C sort)" = "$(printf '%s\n' LICENSE dsclinux services.dsc.resource.json groups.dsc.resource.json | LC_ALL=C sort)"
          unzip -q "$archive" -d "$check_dir"
          test -x "$check_dir/dsclinux"
          for resource in services groups; do
            manifest="$check_dir/${resource}.dsc.resource.json"
            test "$(jq -r '.version' "$manifest")" = "$VERSION"
            test "$(jq -r '.type' "$manifest")" = "DscExtras.Linux/${resource}"
            jq -e --arg resource "$resource" '
              . as $manifest | ["get", "test", "set", "export"] | all(
                . as $operation | $manifest[$operation] |
                .executable == "dsclinux" and .args == [$resource, $operation]
              )
            ' "$manifest" > /dev/null
          done
          build_info=$(go version -m "$check_dir/dsclinux")
          grep -Fq 'GOOS=linux' <<< "$build_info"
          grep -Fq "GOARCH=${GOARCH}" <<< "$build_info"
          grep -Fq 'CGO_ENABLED=0' <<< "$build_info"
          if [[ "$GOARCH" == amd64 ]]; then
            test "$("$check_dir/dsclinux" --version)" = "$VERSION"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dsclinux-linux-${{ matrix.goarch }}
          path: resources/linux/dist/dsclinux-${{ needs.test.outputs.version }}-linux-${{ matrix.goarch }}.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dsclinux-v')
    needs: [test, build]
    runs-on: ubuntu-latest
    concurrency:
      group: dsclinux-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsclinux-linux-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          assets=("dist/dsclinux-${VERSION}-linux-amd64.zip" "dist/dsclinux-${VERSION}-linux-arm64.zip")
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing release asset: $asset"
              exit 1
            fi
          done
          existing_tags=$(gh api --paginate "repos/${GH_REPO}/releases" --jq '.[].tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$existing_tags"; then
            echo "::error::A release or draft for ${GITHUB_REF_NAME} already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --draft \
            --verify-tag \
            --title "dsclinux ${VERSION}" \
            --notes "Linux AMD64 and ARM64 ZIPs for dsclinux ${VERSION}. Each ZIP contains dsclinux, services.dsc.resource.json, groups.dsc.resource.json, and LICENSE."
